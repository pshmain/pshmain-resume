<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Peter Shmain — Full-Stack Engineer</title>
    <meta
      name="description"
      content="Résumé of Peter Shmain, a full-stack engineer in Los Angeles: Provenance, CoDriverHQ, and Sneakerhead. Impact, live work, career timeline, skills, and contact."
    />
    <!-- Progressive enhancement switch (design/blueprint.md). Set before first paint so the
         prerendered page collapses into its interactive layout without a flash. Without
         JavaScript the attribute never appears and every role renders expanded. -->
    <script>
      document.documentElement.dataset.js = '';
    </script>
    <meta name="color-scheme" content="dark" />
    <!-- Blueprint paper, --color-paper in tokens.css. Meta tags cannot read CSS tokens. -->
    <meta name="theme-color" content="#0d2b4e" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Peter Shmain — Full-Stack Engineer" />
    <meta
      property="og:description"
      content="Full-stack engineer in Los Angeles. Impact, live work, career timeline, skills, and contact."
    />
    <!-- scripts/prerender.mjs makes og:image absolute and fills the social marker with og:url +
         canonical when SITE_URL or VERCEL_PROJECT_PRODUCTION_URL is set at build time. -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!--social-->
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The faces on the cover sheet: the name (condensed), body text, and drawing labels. -->
    <link rel="preload" href="/fonts/plex-sans-condensed-600-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
